<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 캐릭터챗 - 로비</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        html, body { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #0f0f12; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: 0; 
        }

        /* 브라우저 스크롤바 커스텀 */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3e3e4a;
            border-radius: 10px;
        }

        /* 앱 컨테이너 */
        .app-container { 
            width: 100%; 
            max-width: 480px; 
            height: 100%; 
            background-color: #16161a; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }

        /* --------------------------------------
         * [상단 헤더 영역 - 검색창 제거]
         * -------------------------------------- */
        .header {
            width: 100%;
            background-color: #1a1a1e;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 18px;
            border-bottom: 1px solid #232329;
            flex-shrink: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            position: relative;
            height: 30px;
        }

        .chat-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #a9a9b3;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s;
            z-index: 10;
        }

        .menu-btn:hover {
            color: #ffffff;
        }

        /* --------------------------------------
         * [중간 스크롤 영역 - 채팅방 리스트]
         * -------------------------------------- */
        .chat-list-content { 
            flex: 1; 
            overflow-y: auto; 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            scroll-behavior: smooth; 
        }

        .chat-card {
            display: flex;
            align-items: center;
            background-color: #1e242f;
            border: 2px solid #000000;
            border-radius: 8px;
            padding: 12px;
            gap: 16px;
            position: relative;
            transition: all 0.2s ease;
        }

        .chat-card-click-area {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-grow: 1;
            cursor: pointer;
        }

        .thumbnail-img {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background-color: #2e303d;
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .card-info {
            flex-grow: 1;
        }

        .card-subject {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .card-control-area {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-action-btn {
            width: 100%;
            height: 100%;
            background-color: #29ccb1;
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .card-action-btn:hover { background-color: #22b099; }
        .card-action-btn:active { transform: scale(0.95); }

        .card-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 32px;
            height: 32px;
            border: 2px solid #525261;
            border-radius: 8px;
            background-color: #121216;
            cursor: pointer;
            position: relative;
            outline: none;
            transition: all 0.2s;
        }

        .card-checkbox:checked {
            background-color: #ef4444;
            border-color: #ef4444;
        }

        .card-checkbox:checked::before {
            content: "\f00c";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: white;
            font-size: 16px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* --------------------------------------
         * [하단 생성 헤더 및 편집 액션 툴바]
         * -------------------------------------- */
        .footer-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background-color: #1a1a1e;
            border-top: 1px solid #232329;
            z-index: 100;
        }

        .edit-action-bar {
            width: 100%;
            height: 0;
            overflow: hidden;
            display: flex;
            gap: 12px;
            padding: 0 16px;
            align-items: center;
            background-color: #212127;
            transition: height 0.25s ease, padding 0.25s ease;
        }

        .edit-action-bar.active {
            height: 60px;
            padding: 10px 16px;
            border-bottom: 1px solid #2d2d35;
        }

        .edit-action-bar button {
            flex: 1;
            height: 40px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .edit-action-bar .delete-action-btn {
            background-color: #ef4444;
            color: #ffffff;
            opacity: 0.4;
            pointer-events: none;
        }

        .edit-action-bar .delete-action-btn.enabled {
            opacity: 1;
            pointer-events: auto;
        }

        .edit-action-bar .delete-action-btn.enabled:hover {
            background-color: #dc2626;
        }

        .edit-action-bar .cancel-action-btn {
            background-color: #3e3e4a;
            color: #e3e3e8;
        }

        .edit-action-bar .cancel-action-btn:hover {
            background-color: #4e4e5d;
        }

        .footer-create-bar {
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .footer-create-bar:hover {
            background-color: #222228;
        }

        .create-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #3a3a44;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
            border: none;
        }

        .create-label {
            font-size: 14px;
            font-weight: 600;
            color: #a9a9b3;
        }

        /* --------------------------------------
         * [우측 캐릭터 생성 대형 사이드바]
         * -------------------------------------- */
        .full-sidebar {
            position: absolute;
            top: 0; 
            right: 0; 
            width: 100%; 
            height: 100%;
            background-color: #000000;
            z-index: 2000;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        .full-sidebar.active { 
            transform: translateX(0);
        }

        /* 사이드바 상단 헤더 */
        .sidebar-header {
            width: 100%;
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1a1a1f;
            position: relative;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .sidebar-close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
            margin-left: auto;
            padding: 4px;
            transition: opacity 0.2s;
        }

        .sidebar-close-btn:hover {
            opacity: 0.7;
        }

        /* 독립 스크롤 바디 영역 */
        .sidebar-scroll-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 썸네일 파일 업로드 및 조절 크로퍼 */
        .thumbnail-crop-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px 0 15px 0;
            border-bottom: 1px solid #1a1a1f;
            gap: 12px;
        }

        .crop-label {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            align-self: flex-start;
        }

        /* 프레임 및 조작 영역 */
        .cropper-frame {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px dashed #3a3a44;
            background-color: #121216;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s;
            touch-action: none;
        }

        .cropper-frame:hover {
            border-color: #29ccb1;
        }

        .cropper-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #72727d;
            gap: 8px;
            pointer-events: none;
        }

        .cropper-placeholder i {
            font-size: 28px;
        }

        .cropper-placeholder span {
            font-size: 11px;
            font-weight: 600;
        }

        /* 조절 작동 시 활성화되는 이미지 원판 (조절용 캔버스) */
        .crop-canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: move;
            display: none;
        }

        /* 조절 보조 가이드 마스크 원 */
        .crop-circular-guide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px solid #29ccb1;
            pointer-events: none;
            display: none;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }

        /* 컨트롤 및 설명 */
        .cropper-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-align: center;
        }

        .cropper-sub-txt {
            font-size: 11px;
            color: #72727d;
            line-height: 1.4;
        }

        .reupload-btn {
            background-color: #2b2b32;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            margin-top: 4px;
        }

        /* 입력 그룹 디자인 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .sidebar-textarea {
            width: 100%;
            height: 100px;
            background-color: #1c1c1f;
            border: 1px solid #2d2d35;
            border-radius: 8px;
            padding: 14px;
            color: #ffffff;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        .sidebar-textarea:focus {
            border-color: #525261;
        }

        .sidebar-textarea.large {
            height: 140px;
        }

        /* 사이드바 하단 버튼 영역 */
        .sidebar-footer {
            padding: 16px 20px 24px 20px;
            border-top: 1px solid #1a1a1f;
            background-color: #000000;
            flex-shrink: 0;
        }

        /* 비활성화 상태의 기본 디자인 */
        .submit-btn {
            width: 100%;
            height: 50px;
            background-color: #2c2c35;
            color: #72727d;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: not-allowed;
            opacity: 0.5;
            transition: all 0.2s ease;
        }

        /* 조건 만족 시 활성화 클래스 */
        .submit-btn.enabled {
            background-color: #29ccb1;
            color: #ffffff;
            cursor: pointer;
            opacity: 1;
        }

        .submit-btn.enabled:hover {
            background-color: #22b099;
        }

        /* 삭제 확인용 컨펌 모달 */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 2500;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-wrapper {
            width: 82%;
            max-width: 320px;
            background-color: #1c1c24;
            border: 1px solid #2d2d3a;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
        }

        .modal-headline {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .m-btn {
            flex: 1;
            padding: 11px 0;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .m-btn.cancel { background-color: #2c2c35; color: #a9a9b3; }
        .m-btn.danger { background-color: #ef4444; color: #ffffff; }

        .m-btn.cancel:hover { background-color: #3f3f4d; color: #ffffff; }
        .m-btn.danger:hover { background-color: #dc2626; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 상단 헤더 (검색 바 제거됨) -->
        <header class="header">
            <div class="header-top">
                <h1 class="chat-title">채팅</h1>
                <button id="lobbyMenuBtn" class="menu-btn" title="편집 모드"><i class="fa-solid fa-ellipsis-vertical"></i></button>
            </div>
        </header>

        <!-- 중간 스크롤 리스트 영역 -->
        <main class="chat-list-content" id="chatList">
            <!-- 동적으로 생성된 카드들이 배치됩니다. -->
        </main>

        <!-- 하단 영역 -->
        <div class="footer-area">
            <!-- 편집 전용 도구 바 -->
            <div class="edit-action-bar" id="editActionBar">
                <button class="cancel-action-btn" id="editCancelBtn">취소</button>
                <button class="delete-action-btn" id="editDeleteBtn">삭제</button>
            </div>
            
            <!-- 하단 생성 버튼 헤더 -->
            <footer class="footer-create-bar" id="createRoomBtn">
                <button class="create-icon-btn"><i class="fa-solid fa-plus"></i></button>
                <span class="create-label">생성</span>
            </footer>
        </div>

        <!-- --------------------------------------
         * [우측 캐릭터 생성 대형 사이드바]
         * -------------------------------------- -->
        <div id="fullSidebar" class="full-sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">캐릭터 생성</h2>
                <button id="sidebarCloseBtn" class="sidebar-close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <!-- 개별 전용 스크롤 구현 바디 -->
            <div class="sidebar-scroll-body">
                
                <!-- [썸네일 이미지 파일 업로드 & 원형 크롭 영역] -->
                <div class="thumbnail-crop-container">
                    <span class="crop-label">썸네일 이미지 *</span>
                    <input type="file" id="thumbnailInput" accept="image/*" style="display: none;">
                    
                    <div class="cropper-frame" id="cropperFrame">
                        <!-- 대기 아이콘 -->
                        <div class="cropper-placeholder" id="cropPlaceholder">
                            <i class="fa-solid fa-image"></i>
                            <span>이미지 업로드</span>
                        </div>
                        <!-- 원형 크롭용 조작 캔버스 -->
                        <canvas class="crop-canvas" id="cropCanvas" width="140" height="140"></canvas>
                        <!-- 원형 조절 가이드 마스크 -->
                        <div class="crop-circular-guide" id="cropGuide"></div>
                    </div>

                    <div class="cropper-controls">
                        <span class="cropper-sub-txt" id="cropTip">이미지를 선택하고 손가락을 벌려 조절해보세요.</span>
                        <button class="reupload-btn" id="reuploadBtn">다시 올리기</button>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">제목 *</label>
                    <textarea id="charName" class="sidebar-textarea validation-target" placeholder="캐릭터의 제목을 입력하세요..."></textarea>
                </div>
                <div class="input-group">
                    <label class="input-label">프롬프트 *</label>
                    <textarea id="charDesc" class="sidebar-textarea large validation-target" placeholder="캐릭터의 배경, 성격, 행동 양식 등을 상세히 적어주세요..."></textarea>
                </div>
                <div class="input-group">
                    <label class="input-label">첫 상황 *</label>
                    <textarea id="charScene" class="sidebar-textarea validation-target" placeholder="채팅이 시작될 때 설정할 첫 주변 환경이나 상태를 묘사해 주세요..."></textarea>
                </div>
                <div class="input-group">
                    <label class="input-label">첫 대사 *</label>
                    <textarea id="charQuote" class="sidebar-textarea validation-target" placeholder="캐릭터가 대화를 열 때 건넬 첫 한마디를 적어주세요..."></textarea>
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="submit-btn" id="sidebarSubmitBtn" disabled>제작하기</button>
            </div>
        </div>

        <!-- 삭제 2단계 확인용 모달 -->
        <div id="deleteConfirmModal" class="modal-overlay">
            <div class="modal-wrapper">
                <div class="modal-headline">정말로 삭제하시겠습니까?</div>
                <div class="modal-btn-group">
                    <button id="modalCancelBtn" class="m-btn cancel">취소</button>
                    <button id="modalConfirmBtn" class="m-btn danger">삭제</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let isEditMode = false;
        let charactersList = []; // 전체 캐릭터 목록 저장 상태 배열

        // DOM 요소 선언
        const lobbyMenuBtn = document.getElementById('lobbyMenuBtn');
        const editActionBar = document.getElementById('editActionBar');
        const editCancelBtn = document.getElementById('editCancelBtn');
        const editDeleteBtn = document.getElementById('editDeleteBtn');
        const createRoomBtn = document.getElementById('createRoomBtn');
        const deleteConfirmModal = document.getElementById('deleteConfirmModal');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');
        const chatList = document.getElementById('chatList');

        // 생성 사이드바 DOM 요소
        const fullSidebar = document.getElementById('fullSidebar');
        const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
        const sidebarSubmitBtn = document.getElementById('sidebarSubmitBtn');
        
        // 텍스트 인풋 타겟 목록
        const textInputs = document.querySelectorAll('.validation-target');

        // 썸네일 크롭 전용 DOM 요소
        const thumbnailInput = document.getElementById('thumbnailInput');
        const cropperFrame = document.getElementById('cropperFrame');
        const cropPlaceholder = document.getElementById('cropPlaceholder');
        const cropCanvas = document.getElementById('cropCanvas');
        const cropGuide = document.getElementById('cropGuide');
        const cropTip = document.getElementById('cropTip');
        const reuploadBtn = document.getElementById('reuploadBtn');

        // ==========================================
        // [ 원형 크롭 내부 동작용 전역 상태 엔진 ]
        // ==========================================
        let sourceImg = new Image();
        const ctx = cropCanvas.getContext('2d');
        const frameSize = 140; // 크로퍼 정방 뷰포트 (140px)

        let isImageUploaded = false; // 이미지 로드 완료 유무 체크 플래그
        let imgX = 0;
        let imgY = 0;
        let baseScale = 1.0;
        let zoomFactor = 1.0;

        let isDragging = false;
        let startX = 0;
        let startY = 0;

        let startTouchDist = 0;
        let startZoomFactor = 1.0;

        // ==========================================
        // 1. 데이터 저장 및 렌더링 로직 (Local Storage)
        // ==========================================
        
        // 페이지 기동 시 데이터 불러오기 및 기본 샘플 세팅
        window.addEventListener('DOMContentLoaded', () => {
            const stored = localStorage.getItem('character_list');
            if (stored) {
                charactersList = JSON.parse(stored);
            } else {
                // 저장소에 아무 데이터도 없을 때의 기본 샘플 캐릭터 세팅 (이름, 썸네일, 상세설정, 첫 상황, 첫 대사 모두 완비)
                charactersList = [
                    {
                        id: 1,
                        name: "아리스",
                        desc: "아날로그 프로그래밍을 좋아하는 정이 많은 소녀.",
                        scene: "도서실 구석 한적한 테이블",
                        quote: "안녕? 너도 코드 짜는 걸 좋아해?",
                        thumbnail: "https://via.placeholder.com/68/2e303d/ffffff?text=Aris"
                    },
                    {
                        id: 2,
                        name: "케빈",
                        desc: "시크하지만 가끔은 따뜻해지는 우주 고양이.",
                        scene: "밤하늘 비치는 발코니 난간 위",
                        quote: "야옹. 인간, 왜 이 늦은 시간까지 잠을 자지 않는 거냥.",
                        thumbnail: "https://via.placeholder.com/68/1a1a24/ffffff?text=Kevin"
                    }
                ];
                saveToLocalStorage();
            }
            renderLobbyList();
        });

        // 로컬 스토리지에 동기화 저장
        function saveToLocalStorage() {
            localStorage.setItem('character_list', JSON.stringify(charactersList));
        }

        // 수집된 목록 데이터를 기반으로 로비 렌더링
        function renderLobbyList() {
            chatList.innerHTML = '';
            
            if (charactersList.length === 0) {
                chatList.innerHTML = `<div style="text-align:center; color:#72727d; margin-top:40px; font-size:14px;">생성된 대화방이 없습니다.<br>하단의 플러스(+) 버튼을 눌러 생성해보세요.</div>`;
                return;
            }

            charactersList.forEach(char => {
                const card = document.createElement('div');
                card.className = 'chat-card';
                card.setAttribute('data-id', char.id);

                let actionAreaHTML = `<button class="card-action-btn"><i class="fa-solid fa-plus"></i></button>`;
                if (isEditMode) {
                    actionAreaHTML = `<input type="checkbox" class="card-checkbox" onchange="checkSelection()">`;
                }

                card.innerHTML = `
                    <div class="chat-card-click-area">
                        <div class="thumbnail-img" style="background-image: url('${char.thumbnail}');"></div>
                        <div class="card-info">
                            <div class="card-subject">${char.name}</div>
                        </div>
                    </div>
                    <div class="card-control-area">
                        ${actionAreaHTML}
                    </div>
                `;
                chatList.appendChild(card);
            });
        }

        // ==========================================
        // 2. 5가지 항목 실시간 실효성 유효성 체크 엔진
        // ==========================================
        function validateSidebarForm() {
            const isNameFilled = document.getElementById('charName').value.trim() !== "";
            const isDescFilled = document.getElementById('charDesc').value.trim() !== "";
            const isSceneFilled = document.getElementById('charScene').value.trim() !== "";
            const isQuoteFilled = document.getElementById('charQuote').value.trim() !== "";

            // 5가지 조건 만족 여부 계산 (텍스트인풋 4개 + 썸네일 활성화 상태)
            const isValid = isNameFilled && isDescFilled && isSceneFilled && isQuoteFilled && isImageUploaded;

            if (isValid) {
                sidebarSubmitBtn.classList.add('enabled');
                sidebarSubmitBtn.removeAttribute('disabled');
            } else {
                sidebarSubmitBtn.classList.remove('enabled');
                sidebarSubmitBtn.setAttribute('disabled', 'true');
            }
        }

        // 인풋에 입력할 때마다 유효성 검사 수행
        textInputs.forEach(input => {
            input.addEventListener('input', validateSidebarForm);
        });

        // ==========================================
        // 3. 상태 전환 기능 함수 (일반 모드 <-> 편집 모드)
        // ==========================================
        function toggleEditMode(active) {
            isEditMode = active;
            
            if (isEditMode) {
                editActionBar.classList.add('active');
                lobbyMenuBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            } else {
                editActionBar.classList.remove('active');
                lobbyMenuBtn.innerHTML = '<i class="fa-solid fa-ellipsis-vertical"></i>';
            }
            renderLobbyList();
            checkSelection();
        }

        function checkSelection() {
            const checkboxes = document.querySelectorAll('.card-checkbox');
            let checkedCount = 0;
            checkboxes.forEach(cb => { if (cb.checked) checkedCount++; });

            if (checkedCount > 0) {
                editDeleteBtn.classList.add('enabled');
            } else {
                editDeleteBtn.classList.remove('enabled');
            }
        }

        // ==========================================
        // 4. 로비 메인 이벤트 인터랙션 리스너
        // ==========================================
        lobbyMenuBtn.addEventListener('click', () => {
            toggleEditMode(!isEditMode);
        });

        editCancelBtn.addEventListener('click', () => {
            toggleEditMode(false);
        });

        editDeleteBtn.addEventListener('click', () => {
            if (editDeleteBtn.classList.contains('enabled')) {
                deleteConfirmModal.classList.add('active');
            }
        });

        modalCancelBtn.addEventListener('click', () => {
            deleteConfirmModal.classList.remove('active');
        });

        modalConfirmBtn.addEventListener('click', () => {
            const checkedCheckboxes = document.querySelectorAll('.card-checkbox:checked');
            const idsToDelete = Array.from(checkedCheckboxes).map(cb => {
                const card = cb.closest('.chat-card');
                return parseInt(card.getAttribute('data-id'));
            });

            // 선택 아이디 목록을 상태 배열에서 원천 필터 아웃
            charactersList = charactersList.filter(char => !idsToDelete.includes(char.id));
            saveToLocalStorage();
            
            deleteConfirmModal.classList.remove('active');
            toggleEditMode(false);
        });

        createRoomBtn.addEventListener('click', () => {
            if (isEditMode) return;
            fullSidebar.classList.add('active');
        });

        sidebarCloseBtn.addEventListener('click', () => {
            fullSidebar.classList.remove('active');
        });

        // ==========================================
        // 5. 썸네일 이미지 로드 & 캔버스 렌더링
        // ==========================================
        cropperFrame.addEventListener('click', () => {
            if (!sourceImg.src) {
                thumbnailInput.click();
            }
        });

        reuploadBtn.addEventListener('click', () => {
            thumbnailInput.click();
        });

        thumbnailInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                sourceImg = new Image();
                sourceImg.onload = function() {
                    baseScale = Math.max(frameSize / sourceImg.width, frameSize / sourceImg.height);
                    zoomFactor = 1.0; 

                    centerImage();

                    cropPlaceholder.style.display = 'none';
                    cropCanvas.style.display = 'block';
                    cropGuide.style.display = 'block';
                    reuploadBtn.style.display = 'block';
                    cropTip.innerHTML = "드래그로 맞추고 마우스 휠이나<br>두 손가락을 벌려 크기를 조절하세요.";

                    isImageUploaded = true;
                    validateSidebarForm(); // 업로드 성공 체크

                    drawCanvas();
                };
                sourceImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function drawCanvas() {
            ctx.clearRect(0, 0, frameSize, frameSize);
            
            const currentWidth = sourceImg.width * baseScale * zoomFactor;
            const currentHeight = sourceImg.height * baseScale * zoomFactor;

            const minX = frameSize - currentWidth;
            const minY = frameSize - currentHeight;

            imgX = Math.min(0, Math.max(minX, imgX));
            imgY = Math.min(0, Math.max(minY, imgY));

            ctx.drawImage(sourceImg, imgX, imgY, currentWidth, currentHeight);
        }

        function centerImage() {
            const currentWidth = sourceImg.width * baseScale * zoomFactor;
            const currentHeight = sourceImg.height * baseScale * zoomFactor;
            imgX = (frameSize - currentWidth) / 2;
            imgY = (frameSize - currentHeight) / 2;
        }

        // ==========================================
        // 6. 데스크톱 스크롤 줌 & 모바일 핀치 줌 / 드래그
        // ==========================================
        cropCanvas.addEventListener('wheel', (e) => {
            if (!sourceImg.src) return;
            e.preventDefault();

            const zoomDelta = e.deltaY < 0 ? 0.05 : -0.05;
            applyZoom(zoomDelta, e.offsetX, e.offsetY);
        }, { passive: false });

        function applyZoom(delta, focusX = frameSize/2, focusY = frameSize/2) {
            const oldZoom = zoomFactor;
            zoomFactor = Math.min(3.0, Math.max(1.0, zoomFactor + delta));
            
            const ratio = zoomFactor / oldZoom;
            imgX = focusX - (focusX - imgX) * ratio;
            imgY = focusY - (focusY - imgY) * ratio;

            drawCanvas();
        }

        function startDrag(clientX, clientY) {
            if (!sourceImg.src) return;
            isDragging = true;
            startX = clientX - imgX;
            startY = clientY - imgY;
        }

        function moveDrag(clientX, clientY) {
            if (!isDragging) return;
            imgX = clientX - startX;
            imgY = clientY - startY;
            drawCanvas();
        }

        function stopDrag() {
            isDragging = false;
        }

        cropCanvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            startDrag(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            moveDrag(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', stopDrag);

        cropCanvas.addEventListener('touchstart', (e) => {
            if (!sourceImg.src) return;
            e.preventDefault();

            if (e.touches.length === 1) {
                const touch = e.touches[0];
                startDrag(touch.clientX, touch.clientY);
            } else if (e.touches.length === 2) {
                isDragging = false;
                startTouchDist = getTouchDistance(e.touches);
                startZoomFactor = zoomFactor;
            }
        }, { passive: false });

        cropCanvas.addEventListener('touchmove', (e) => {
            if (!sourceImg.src) return;
            e.preventDefault();

            if (e.touches.length === 1 && isDragging) {
                const touch = e.touches[0];
                moveDrag(touch.clientX, touch.clientY);
            } else if (e.touches.length === 2) {
                const currentDist = getTouchDistance(e.touches);
                const scaleRatio = currentDist / startTouchDist;

                const focusX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - cropCanvas.getBoundingClientRect().left;
                const focusY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - cropCanvas.getBoundingClientRect().top;

                const targetZoom = Math.min(3.0, Math.max(1.0, startZoomFactor * scaleRatio));
                const oldZoom = zoomFactor;
                zoomFactor = targetZoom;

                const ratio = zoomFactor / oldZoom;
                imgX = focusX - (focusX - imgX) * ratio;
                imgY = focusY - (focusY - imgY) * ratio;

                drawCanvas();
            }
        }, { passive: false });

        cropCanvas.addEventListener('touchend', (e) => {
            stopDrag();
            if (e.touches.length === 1) {
                const touch = e.touches[0];
                startDrag(touch.clientX, touch.clientY);
            }
        });

        function getTouchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // ==========================================
        // 7. '제작하기' 완결 및 로컬 레코딩 추가 연계
        // ==========================================
        sidebarSubmitBtn.addEventListener('click', () => {
            if (sidebarSubmitBtn.hasAttribute('disabled')) return;

            const nameValue = document.getElementById('charName').value.trim();
            const descValue = document.getElementById('charDesc').value.trim();
            const sceneValue = document.getElementById('charScene').value.trim();
            const quoteValue = document.getElementById('charQuote').value.trim();
            
            let croppedImageDataURL = "";
            if (sourceImg.src) {
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = frameSize;
                exportCanvas.height = frameSize;
                const exportCtx = exportCanvas.getContext('2d');

                exportCtx.beginPath();
                exportCtx.arc(frameSize/2, frameSize/2, frameSize/2, 0, Math.PI * 2);
                exportCtx.clip();

                const currentWidth = sourceImg.width * baseScale * zoomFactor;
                const currentHeight = sourceImg.height * baseScale * zoomFactor;

                exportCtx.drawImage(sourceImg, imgX, imgY, currentWidth, currentHeight);
                croppedImageDataURL = exportCanvas.toDataURL(); 
            }

            // 새 캐릭터 고유 객체 생성
            const newCharacter = {
                id: Date.now(), 
                name: nameValue,
                desc: descValue,
                scene: sceneValue,
                quote: quoteValue,
                thumbnail: croppedImageDataURL 
            };

            charactersList.push(newCharacter);
            saveToLocalStorage();
            renderLobbyList();

            alert(`"${nameValue}" 캐릭터 방이 로비에 성공적으로 생성되었습니다!`);
            
            // 입력 폼 초기화
            document.getElementById('charName').value = '';
            document.getElementById('charDesc').value = '';
            document.getElementById('charScene').value = '';
            document.getElementById('charQuote').value = '';
            thumbnailInput.value = '';
            sourceImg = new Image();
            ctx.clearRect(0, 0, frameSize, frameSize);
            
            cropPlaceholder.style.display = 'flex';
            cropCanvas.style.display = 'none';
            cropGuide.style.display = 'none';
            reuploadBtn.style.display = 'none';
            cropTip.innerText = "이미지를 터치/클릭하여 등록하세요.";

            isImageUploaded = false;
            validateSidebarForm();

            fullSidebar.classList.remove('active');
        });

        // ==========================================
        chatList.addEventListener('click', (e) => {
            if (isEditMode) return;

            const clickArea = e.target.closest('.chat-card-click-area');
            const plusBtn = e.target.closest('.card-action-btn');

            // 1) 일반 카드 영역 클릭 시 채팅 진입
            if (clickArea) {
                const card = clickArea.closest('.chat-card');
                const id = parseInt(card.getAttribute('data-id'));
                const character = charactersList.find(char => char.id === id);

                if (character) {
                    // 현재 활성화된 캐릭터 ID를 로컬스토리지에 저장
                    localStorage.setItem('current_chat_id', id);

                    localStorage.setItem(`saved_chat_제목_${id}`, localStorage.getItem(`saved_chat_제목_${id}`) || character.name);
                    localStorage.setItem(`saved_chat_프롬프트_${id}`, localStorage.getItem(`saved_chat_프롬프트_${id}`) || character.desc);
                    localStorage.setItem(`saved_chat_첫 상황_${id}`, localStorage.getItem(`saved_chat_첫 상황_${id}`) || character.scene);
                    localStorage.setItem(`saved_chat_첫 대사_${id}`, localStorage.getItem(`saved_chat_첫 대사_${id}`) || character.quote);
                    localStorage.setItem(`saved_chat_썸네일_${id}`, localStorage.getItem(`saved_chat_썸네일_${id}`) || character.thumbnail);

                    localStorage.setItem(`saved_chat_페르소나_${id}`, localStorage.getItem(`saved_chat_페르소나_${id}`) || "");
                    localStorage.setItem(`saved_chat_유저노트_${id}`, localStorage.getItem(`saved_chat_유저노트_${id}`) || "");
                    localStorage.setItem(`saved_chat_메모리북_${id}`, localStorage.getItem(`saved_chat_메모리북_${id}`) || "");

                    // 채팅방 페이지로 이동
                    window.location.href = `chating.html?id=${id}`;
                }
            }

            // 2) 개별 [+] 버튼 클릭 시 복제된 신규 채팅방 개설 (기존 기능 유지)
            if (plusBtn) {
                e.stopPropagation(); 
                const card = plusBtn.closest('.chat-card');
                const targetId = parseInt(card.getAttribute('data-id'));
                const originalChar = charactersList.find(char => char.id === targetId);

                if (originalChar) {
                    const copiedCharacter = {
                        id: Date.now(), 
                        name: `${originalChar.name} (복사본)`, 
                        thumbnail: originalChar.thumbnail,
                        desc: originalChar.desc,
                        scene: originalChar.scene,
                        quote: originalChar.quote
                    };

                    charactersList.push(copiedCharacter);
                    saveToLocalStorage();
                    renderLobbyList();
                    alert(`"${originalChar.name}"의 기본 정보가 포함된 새 대화방이 생성되었습니다!`);
                }
            }
        });
    </script>
