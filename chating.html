<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 캐릭터챗</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f0f12; color: #ffffff; display: flex; justify-content: center; align-items: center; margin:0; }

        /* 브라우저 스크롤바 커스텀 */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3e3e4a;
            border-radius: 10px;
        }

        /* 앱 컨테이너 */
        .app-container { width: 100%; max-width: 480px; height: 100%; background-color: #16161a; position: relative; overflow: hidden; display: flex; flex-direction: column; }

        /* 상단 헤더 바 */
        .header {
            width: 100%;
            height: 65px;
            background-color: #09090b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #232329;
            flex-shrink: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .profile-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #ffb6c1;
            background-image: url('https://via.placeholder.com/42');
            background-size: cover;
        }

        .chat-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-right .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
        }

        /* 대화 메시지 영역 */
        .chat-content { flex: 1; overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 22px; scroll-behavior: smooth; }

        .msg-block {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .msg-box { white-space: pre-wrap; background-color: #22222a; border: 1px solid #31313c; color: #e3e3e8; padding: 16px; font-size: 16px; line-height: 1.5; border-radius: 14px; }

        .msg-block.user .msg-box {
            background-color: #22222a;
            border: 1px solid #31313c;
            color: #e3e3e8;
            align-self: flex-end;
        }

        .action-btns {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .msg-block.ai .action-btns { justify-content: flex-start; }
        .msg-block.user .action-btns { justify-content: flex-end; }

        .action-btn {
            background-color: #2c2c35;
            border: 1px solid #3f3f4d;
            color: #a9a9b3;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }

        .action-btn:hover {
            color: #ffffff;
            background-color: #3f3f4d;
        }

        /* 말풍선 내부 인라인 수정 상태 UI */
        .msg-block.editing .msg-box,
        .msg-block.editing .action-btns {
            display: none !important;
        }

        .edit-textarea {
            width: 100%;
            field-sizing: content;
            min-height: 80px;
            background-color: #121216;
            border: 1px solid #3b82f6;
            border-radius: 14px;
            padding: 14px;
            color: #ffffff;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            outline: none;
            margin-bottom: 8px;
        }

        .edit-controls {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .msg-block.ai .edit-controls { justify-content: flex-start; }
        .msg-block.user .edit-controls { justify-content: flex-end; }

        .edit-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .edit-btn.cancel { background-color: #2c2c35; color: #a9a9b3; }
        .edit-btn.save { background-color: #3b82f6; color: #ffffff; }
        .edit-btn.cancel:hover { background-color: #3f3f4d; color: #ffffff; }
        .edit-btn.save:hover { background-color: #2563eb; }

        /* 우측 플로팅 버튼 그룹 */
        .floating-sidebar {
            position: absolute;
            right: 20px;
            bottom: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 99;
            opacity: 0.7;
        }

        .scroll-btn {
            width: 36px;
            height: 36px;
            background-color: #353542;
            border: 1px solid #4a4a5a;
            border-radius: 50%;
            color: #e3e3e8;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            transition: background-color 0.2s, color 0.2s;
        }

        .scroll-btn:hover {
            background-color: #4a4a5a;
            color: #ffffff;
        }

        /* 하단 메시지 입력 바 */
        .footer {
            background-color: #1c1c24;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-radius: 28px;
            border: 1px solid #2d2d3a;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
            flex-shrink: 0;
            margin: 10px 16px 20px 16px;
            z-index: 100;
        }

        .input-box {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            resize: none;
            height: 50px;
        }

        .input-box::placeholder { color: #626273; }

        .footer-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .left-utils {
            display: flex;
            gap: 28px;
        }

        .util-btn, .send-btn {
            background: none;
            border: none;
            color: #8e8e9f;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .util-btn { font-size: 22px; }
        .send-btn:hover, .util-btn:hover { color: #ffffff; }

        /* 사이드바 오버레이 */
        .sidebar-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 기본 설정 우측 사이드바 */
        .sidebar {
            position: absolute;
            top: 0; right: 0; width: 82%; max-width: 390px; height: 100%;
            background-color: #141418;
            z-index: 2000;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 24px 22px;
            display: flex;
            flex-direction: column;
            box-shadow: -6px 0 24px rgba(0,0,0,0.5);
        }

        .sidebar.active { transform: translateX(0); }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .sidebar-close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-section-title {
            font-size: 13px;
            color: #525261;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .sidebar-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 2px;
            color: #e3e3e8;
            cursor: pointer;
        }

        .sidebar-item-left {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 16px;
            font-weight: 500;
        }

        .sidebar-item-left i {
            color: #8e8e9f;
            width: 20px;
            text-align: center;
        }

        .sidebar-item-right {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #626273;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid #22222a;
            flex-shrink: 0;
        }

        /* 입력 모듈(모달) 스타일 구성 */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 2500;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-wrapper {
            width: 88%;
            max-width: 380px;
            background-color: #1c1c24;
            border: 1px solid #2d2d3a;
            border-radius: 24px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
        }

        .modal-wrapper.confirm-type {
            max-width: 340px;
            text-align: center;
            padding: 28px 22px;
            gap: 20px;
        }

        .modal-headline {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            line-height: 1.5;
        }

        .modal-textarea {
            width: 100%;
            height: 320px;
            background-color: #121216;
            border: 1px solid #2d2d3a;
            border-radius: 14px;
            padding: 14px;
            color: #ffffff;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        .modal-btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            width: 100%;
        }

        .modal-wrapper.confirm-type .modal-btn-group {
            justify-content: center;
        }

        .m-btn {
            padding: 11px 22px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .m-btn.cancel { background-color: #2c2c35; color: #a9a9b3; }
        .m-btn.save { background-color: #3b82f6; color: #ffffff; }
        .m-btn.danger { background-color: #ef4444; color: #ffffff; }

        .m-btn.cancel:hover { background-color: #3f3f4d; color: #ffffff; }
        .m-btn.save:hover { background-color: #2563eb; }
        .m-btn.danger:hover { background-color: #dc2626; }

        /* 화면 전체를 채우는 대형 단독 사이드바 */
        .full-sidebar {
            position: absolute;
            top: 0; right: 0; width: 100%; height: 100%;
            background-color: #0e0e11;
            z-index: 2100;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 24px 22px;
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.7);
        }

        .full-sidebar.active { transform: translateX(0); }

        .full-sidebar-body {
            flex: 1;
            overflow-y: auto;
            margin-top: 15px;
            padding: 10px 20px; /* 좌우 여백을 조금 더 확보하여 가독성 증대 */
            color: #d1d1d6;
            font-size: 15px;
            line-height: 1.6;
            height: auto; /* 고정 높이 해제 */
        }

        /* 2. 카드의 박스 형태를 제거하고 본문의 일부로 통합 */
        .custom-log-card {
            background-color: transparent; /* 배경색 제거 */
            border: none;                  /* 테두리 제거 */
            border-radius: 0;
            padding: 0;                    /* 안쪽 여백 제거 */
            margin-bottom: 24px;           /* 섹션 간의 간격만 유지 */
        }

        /* 3. 제목 스타일은 유지하되 강조 */
        .custom-log-card h4 { 
            color: #ffffff; 
            margin-bottom: 12px; 
            font-size: 18px; 
            border-bottom: 1px solid #3b82f6; /* 하단에 가벼운 강조선 추가 */
            padding-bottom: 8px;
        }

        .sys-msg { text-align: center; color: #8e8e9f; font-size: 13px; font-style: italic; margin-bottom: 10px; }
        .sys-success { color: #10b981; font-weight: bold; background: rgba(16, 185, 129, 0.1); padding: 8px; border-radius: 8px; }
        .custom-status-window { border: 2px solid #3b82f6; background-color: #1a1a24; border-radius: 10px; padding: 12px; margin-top: 8px; }
        .custom-status-title { font-weight: 700; color: #60a5fa; border-bottom: 1px solid #3b82f6; padding-bottom: 6px; margin-bottom: 6px; font-size: 15px; }
        .gray-italic { color: #8e8e9f; font-style: italic; }
        .chat-image { max-width: 100%; border-radius: 8px; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <div class="header-left">
                <button class="back-btn"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="profile-img"></div>
                <h1 class="chat-title">제목</h1>
            </div>
            <div class="header-right">
                <button id="menuBtn" class="menu-btn"><i class="fa-solid fa-ellipsis"></i></button>
            </div>
        </header>

        <main id="chatContent" class="chat-content">
            <div class="msg-block ai">
                <div id="firstAiMsgBox" class="msg-box">안녕하세요! 반갑습니다. 무엇을 도와드릴까요?</div>
                <div class="action-btns">
                    <button class="action-btn edit-trigger"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button class="action-btn trash-trigger"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            </div>
        </main>

        <div class="floating-sidebar">
            <button id="scrollTopBtn" class="scroll-btn"><i class="fa-solid fa-arrow-up"></i></button>
            <button id="floatingMenuBtn" class="scroll-btn"><i class="fa-solid fa-ellipsis"></i></button>
            <button id="scrollBottomBtn" class="scroll-btn"><i class="fa-solid fa-arrow-down"></i></button>
        </div>

        <footer class="footer">
            <textarea id="mainChatInput" class="input-box" placeholder="메시지를 입력하세요..." rows="2"></textarea>
            <div class="footer-controls">
                <div class="left-utils">
                    <button id="btnQuote" class="util-btn">"</button>
                    <button id="btnStar" class="util-btn">*</button>
                </div>
                <button id="sendBtn" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </footer>

        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">채팅방 설정</h2>
                <button id="sidebarCloseBtn" class="sidebar-close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="sidebar-content">
                <div class="sidebar-section">
                    <div class="sidebar-section-title">기본 설정</div>
                    <div class="sidebar-item open-input-mod" data-target="페르소나">
                        <div class="sidebar-item-left"><i class="fa-solid fa-user"></i>페르소나</div>
                        <div class="sidebar-item-right"><i class="fa-solid fa-chevron-right"></i></div>
                    </div>
                    <div class="sidebar-item open-input-mod" data-target="유저노트">
                        <div class="sidebar-item-left"><i class="fa-solid fa-note-sticky"></i>유저노트</div>
                        <div class="sidebar-item-right"><i class="fa-solid fa-chevron-right"></i></div>
                    </div>
                    <div class="sidebar-item open-input-mod" data-target="메모리북">
                        <div class="sidebar-item-left"><i class="fa-solid fa-book"></i>메모리북</div>
                        <div class="sidebar-item-right"><i class="fa-solid fa-chevron-right"></i></div>
                    </div>
                </div>
                <div class="sidebar-section">
                    <div class="sidebar-section-title">고급 설정</div>
                    <div class="sidebar-item open-input-mod" data-target="프롬프트">
                        <div class="sidebar-item-left"><i class="fa-solid fa-terminal"></i>프롬프트</div>
                        <div class="sidebar-item-right"><i class="fa-solid fa-chevron-right"></i></div>
                    </div>
                    <div class="sidebar-item open-input-mod" data-target="첫 대사">
                        <div class="sidebar-item-left"><i class="fa-solid fa-comment-dots"></i>첫 대사</div>
                        <div class="sidebar-item-right"><i class="fa-solid fa-chevron-right"></i></div>
                    </div>
                    <div class="sidebar-item open-input-mod" data-target="첫 상황">
                        <div class="sidebar-item-left"><i class="fa-solid fa-location-dot"></i>첫 상황</div>
                        <div class="sidebar-item-right"><i class="fa-solid fa-chevron-right"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="fullSidebar" class="full-sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">외부 상태창</h2>
                <div class="sidebar-header-btns" style="margin-left: auto; display: flex; gap: 8px;">
                    <button id="sidebarEditBtn" class="sidebar-tool-btn" title="HTML 편집" 
                            style="background: #1a1a1a; color: #ffffff; border: none; outline: none; border-radius: 4px; padding: 6px 10px; cursor: pointer; transition: all 0.2s;">
                        <i class="fa-solid fa-code"></i>
                    </button>
                    <button id="fullSidebarCloseBtn" class="sidebar-close-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            
            <div class="full-sidebar-body">
                <!-- 1. 실제로 사용자의 HTML이 렌더링되어 보여지는 공간 -->
                <div id="sidebarViewContainer" class="sidebar-view-container">
                    <div class="custom-log-card">
                        <h4>시스템 데이터 구조 정보</h4>
                        <p>이곳에 HTML 형식의 로그 분석이나 원시 컨텍스트 데이터를 자유롭게 기록할 수 있습니다.</p>
                    </div>
                </div>

                <!-- 2. 사용자가 HTML 코드를 작성하는 에디터 공간 (기본 숨김) -->
                <div id="sidebarEditContainer" class="sidebar-edit-container" style="display: none; flex-direction: column; height: 100%; gap: 10px;">
                    <p style="font-size: 12px; color: #888; margin: 0;">💡 원하는 HTML, CSS(style) 코드를 자유롭게 입력해 보세요.</p>
                    <textarea id="sidebarHtmlInput" class="edit-textarea" style="flex-grow: 1; min-height: 250px; font-family: monospace; resize: vertical;"></textarea>
                    <div style="display: flex; gap: 8px; justify-content: flex-end;">
                        <button id="sidebarCancelBtn" class="edit-btn cancel">취소</button>
                        <button id="sidebarSaveBtn" class="edit-btn save">저장 및 적용</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="inputModal" class="modal-overlay">
            <div class="modal-wrapper">
                <h3 id="modalTitle" class="modal-headline">제목</h3>
                <textarea id="modalTextarea" class="modal-textarea" placeholder="내용을 입력해주세요..."></textarea>
                <div class="modal-btn-group">
                    <button id="modalCancelBtn" class="m-btn cancel">취소</button>
                    <button id="modalSaveBtn" class="m-btn save">저장</button>
                </div>
            </div>
        </div>

        <div id="deleteConfirmModal" class="modal-overlay">
            <div class="modal-wrapper confirm-type">
                <div class="modal-headline">정말 삭제하시겠습니까?</div>
                <div class="modal-btn-group">
                    <button id="deleteCancelBtn" class="m-btn cancel">취소</button>
                    <button id="deleteConfirmBtn" class="m-btn danger">삭제</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 전역 변수 설정
        const API_KEY = "AQ.Ab8RN6JZ6VCpazmGE1Fqexe02VEDpVYttR9ZlCaFt6Gut2q5RQ-4M6l3ICg";
        const MODEL = "gemini-3-flash-preview";

        const urlParams = new URLSearchParams(window.location.search);
        const currentChatId = urlParams.get('id') || localStorage.getItem('current_chat_id');
        if (!currentChatId) {
            alert("올바르지 않은 접근입니다. 로비로 이동합니다.");
            window.location.href = 'index.html';
        }

        const HISTORY_KEY = `saved_chat_history_${currentChatId}`;
        const TURN_KEY = `saved_chat_turnCount_${currentChatId}`;

        chatContent.addEventListener('click', (e) => {
            const btn = e.target.closest('.action-btn');

        // 마크다운 파서
        function parseMarkdown(text) {
            // 상황 설명 (**텍스트**)
            text = text.replace(/\*\*(.*?)\*\*/g, '<span class="gray-italic">$1</span>');
            
            // 이미지 렌더링 (![]("주소") 또는 ![](주소))
            text = text.replace(/!\[(.*?)\]\(["']?(.*?)["']?\)/g, (match, alt, url) => {
                let finalUrl = url.trim();

                // 1. 만약 http:// 나 https:// 로 시작하는 웹주소라면?
                if (finalUrl.startsWith('http://') || finalUrl.startsWith('https://')) {
                    // 원래 웹주소 그대로 사용
                    return `<img src="${finalUrl}" class="chat-image" alt="${alt || 'ai-image'}" referrerpolicy="no-referrer" />`;
                } 
                
                // 2. 웹주소가 아니라 파일명(예: Aa0.webp) 또는 상대 경로라면?
                else {
                    // 혹시 풀 URL에서 파일명만 넘어왔을 때를 대비해 파일명만 추출
                    const fileName = finalUrl.split('/').pop();
                    // 로컬 images 폴더 경로로 변경
                    const localUrl = `./images/${fileName}`;
                    
                    return `<img src="${localUrl}" class="chat-image" alt="${alt || 'ai-image'}" />`;
                }
            });
            
            // 상태창 렌더링 (```제목\n내용\n```)
            text = text.replace(/```(.*?)\n([\s\S]*?)```/g, '<div class="custom-status-window"><div class="custom-status-title">$1</div><div>$2</div></div>');
            
            return text;
        }

        // 인라인 수정 모드 진입
        function enterInlineEditMode(msgBlock) {
            if (msgBlock.classList.contains('editing')) return;
            msgBlock.classList.add('editing');

            const msgBox = msgBlock.querySelector('.msg-box');
            
            // HTML로 파싱된 텍스트 대신, dataset에 저장해 둔 원본 마크다운을 불러옵니다.
            const originalText = msgBlock.dataset.raw || msgBox.textContent;

            const textarea = document.createElement('textarea');
            textarea.className = 'edit-textarea';
            textarea.value = originalText;

            const controls = document.createElement('div');
            controls.className = 'edit-controls';

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'edit-btn cancel';
            cancelBtn.textContent = '취소';

            const saveBtn = document.createElement('button');
            saveBtn.className = 'edit-btn save';
            saveBtn.textContent = '저장';

            controls.appendChild(cancelBtn);
            controls.appendChild(saveBtn);
            msgBlock.appendChild(textarea);
            msgBlock.appendChild(controls);
            textarea.focus();

            cancelBtn.addEventListener('click', () => {
                exitInlineEditMode(msgBlock);
            });

            saveBtn.addEventListener('click', () => {
                const newText = textarea.value;
                
                // 1. 화면 및 요소 자체 데이터셋 업데이트
                msgBlock.dataset.raw = newText;
                msgBox.innerHTML = parseMarkdown(newText);
                
                // 2. chatHistory 배열에서의 인덱스 계산 (첫 대사 제외)
                const allMsgBlocks = Array.from(chatContent.querySelectorAll('.msg-block'));
                const historyBlocks = allMsgBlocks.filter(block => !block.contains(firstAiMsgBox));
                const targetIndex = historyBlocks.indexOf(msgBlock);

                // chatHistory가 존재하고 인덱스가 유효한지 안전 검사
                if (typeof chatHistory !== 'undefined' && Array.isArray(chatHistory) && targetIndex !== -1) {
                    
                    if (chatHistory[targetIndex]) {
                        // 타입 A: 객체 형태 { role: '...', content: '...' } 일 때
                        if (typeof chatHistory[targetIndex] === 'object' && chatHistory[targetIndex] !== null) {
                            chatHistory[targetIndex].content = newText;
                        } 
                        // 타입 B: 단순 문자열 배열일 때 ['...', '...']
                        else if (typeof chatHistory[targetIndex] === 'string') {
                            chatHistory[targetIndex] = newText;
                        }
                    }

                    // 3. 안전하게 로컬스토리지 저장
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(chatHistory));
                    console.log(`수정 성공 및 로컬스토리지 동기화 완료 (index: ${targetIndex})`);
                } else {
                    console.error("chatHistory 배열을 찾을 수 없거나 인덱스가 올바르지 않습니다.");
                }

                // 4. 편집 모드 종료
                exitInlineEditMode(msgBlock);
            });
        }

        function exitInlineEditMode(msgBlock) {
            msgBlock.classList.remove('editing');
            const textarea = msgBlock.querySelector('.edit-textarea');

                const historyBlocks = allMsgBlocks.filter(block => !block.contains(firstAiMsgBox));

                if (targetIndex !== -1 && chatHistory[targetIndex]) {
                    // [추가] 삭제하려는 타겟이 AI의 답변인지 확인합니다.
                    // 데이터 구조가 { role: 'assistant', content: '...' } 형태일 때 동작합니다.
                    const isAiResponse = chatHistory[targetIndex].role === 'ai';

                    // 2. chatHistory 배열에서 해당 원소 영구 제거 및 저장
                    chatHistory.splice(targetIndex, 1);

        // ==========================================
        // 6. 사용자 채팅 송신 메커니즘
        // ==========================================
        function executeUserSendMessage() {
            const messageText = mainChatInput.value.trim();
            if (!messageText) return;

            if (document.getElementById('thinkingBox')) return;

            // [수정 포인트 1] API 전송 전, chatHistory에 사용자의 입력값을 확실히 추가합니다.
            chatHistory.push({ role: 'user', content: messageText });
            localStorage.setItem(HISTORY_KEY, JSON.stringify(chatHistory));

            // [수정 포인트 2] 화면에 사용자 메시지 렌더링 (빈 템플릿 리터럴 복구)
            const userMsgBlock = document.createElement('div');
            userMsgBlock.className = 'msg-block user';
            userMsgBlock.dataset.raw = messageText;

            const safeText = messageText
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            const formattedText = parseMarkdown(safeText);

            userMsgBlock.innerHTML = `<div class="msg-box">${formattedText}</div>`;
            chatContent.appendChild(userMsgBlock);

            mainChatInput.value = '';
            chatContent.scrollTo({ top: chatContent.scrollHeight, behavior: 'smooth' });

            simulateAiResponse(messageText);
        }

        sendBtn.addEventListener('click', executeUserSendMessage);

        mainChatInput.addEventListener('keydown', (e) => {
            // 모바일 환경 체크 (간단한 정규표현식)
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

            // 모바일이 아닐 때만 엔터 전송 활성화
            if (!isMobile && e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                executeUserSendMessage();
            }
        });

        // ==========================================

        // ==========================================
        function showThinkingUI() {
            const box = document.createElement('div');
            box.id = 'thinkingBox';
            box.className = 'sys-msg';
            box.innerHTML = `0초 동안 생각하는 중...`;
            chatContent.appendChild(box);
            chatContent.scrollTo({ top: chatContent.scrollHeight, behavior: 'smooth' });

            thinkingSeconds = 0;
            thinkingTimer = setInterval(() => {
                if (!isSummarizing) {
                    thinkingSeconds++;
                    const tBox = document.getElementById('thinkingBox');
                    if (tBox) {
                        tBox.innerHTML = `${thinkingSeconds}초 동안 생각하는 중...`;
                    }
                }
            }, 1000);
        }

        function stopThinkingUI() {
            clearInterval(thinkingTimer);
            const box = document.getElementById('thinkingBox');
            if (box) box.remove();
        }

        // ==========================================
        // 9. API 통신 및 요약 로직
        // ==========================================
        async function simulateAiResponse(userText) {
            showThinkingUI();
            
            turnCount++;
            localStorage.setItem(TURN_KEY, turnCount);

            const promptVal = localStorage.getItem(`saved_chat_프롬프트_${currentChatId}`) || "";
            const personaVal = localStorage.getItem(`saved_chat_페르소나_${currentChatId}`) || "";
            const userNoteVal = localStorage.getItem(`saved_chat_유저노트_${currentChatId}`) || "";
            const memoryBookVal = localStorage.getItem(`saved_chat_메모리북_${currentChatId}`) || "";
            const firstSituationVal = localStorage.getItem(`saved_chat_첫 상황_${currentChatId}`) || "";

            let systemInstruction = `
            [당신의 역할 및 글쓰기 스타일 지침]
            - 당신은 몰입감 넘치는 인터랙티브 소설의 공동 저자이자 뛰어난 롤플레이어 AI입니다.
            - 장면의 시각적 묘사와 심리는 **핵심 위주로 완결성 있게 서술(2~3문장 내외)**하여 상황 설명이 지나치게 길어지지 않도록 절제하십시오.
            - 지문(상황 설명)이 너무 길어지면 답변이 잘릴 수 있으므로, **지문과 대사의 비율을 1:1 정도로 균형 있게 유지**해야 합니다.
            - [매우 중요] 캐릭터가 말하는 대사는 반드시 큰따옴표(" ")로 묶어야 하며, 대사를 제외한 모든 지문(상황 설명, 행동 묘사, 감정 등)은 무조건 ** ** 기호로 감싸서 작성하십시오. 예외는 없습니다.
            - 대화의 흐름과 감정선이 생생하게 살 수 있도록 몰입감 있는 대사(2~3문장 이상)와 감정 묘사를 조화롭게 이어서 전개해 주세요.

            [세계관 및 대화 규칙 (프롬프트)]
            - 아래 프롬프트나 기타 설정 내용 중 '{{user}}' 또는 'user'라는 기호가 포함되어 있다면, 이는 모두 페르소나에 기록된 '사용자의 실제 이름'으로 치환하여 인식하고 대답해야 합니다.
            ${promptVal}

            [사용자 페르소나]
            - 아래 기록된 페르소나 내용을 바탕으로 사용자의 '이름(또는 호칭)'을 파악하여 자연스럽게 부르십시오.
            - [경고] 대화 중 절대 'user'나 '{{user}}'라는 영단어 및 기호를 그대로 출력하지 마십시오.
            ${personaVal}

            [유저노트 (반드시 기억하고 대화에 반영해야 할 중요 사항)]
            ${userNoteVal}

            [메모리북 (그동안 누적된 대화 줄거리 요약본)]
            ${memoryBookVal}
            `.trim();

            if (turnCount === 1 && firstSituationVal) {
                systemInstruction += `\n\n[첫 상황 및 배경]\n${firstSituationVal}`;
            }

            let sanitizedContents = [];
            let lastRole = null;

            chatHistory.forEach((msg) => {
                let currentRole = msg.role === 'user' ? 'user' : 'model';

                // 배열의 첫 데이터가 'model'일 경우 API가 거절하므로 'user'로 강제 변환하여 보호
                if (sanitizedContents.length === 0 && currentRole === 'model') {
                    currentRole = 'user';
                }

                // 역할이 이전 메시지와 중복될 경우, 새로운 객체를 만들지 않고 텍스트를 병합
                if (lastRole === currentRole) {
                    sanitizedContents[sanitizedContents.length - 1].parts[0].text += "\n\n" + msg.content;
                } else {
                    sanitizedContents.push({
                        role: currentRole,
                        parts: [{ text: msg.content }]
                    });
                    lastRole = currentRole;
                }
            });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: sanitizedContents,
                        systemInstruction: { parts: [{ text: systemInstruction }] },
                        // 아래 safetySettings 배열을 추가하여 필터를 해제하세요.
                        safetySettings: [
                            { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                        ],
                        generationConfig: {
                            temperature: 0.8,
                            maxOutputTokens: 4000,
                            topP: 0.8
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 요청 실패 (상태 코드: ${response.status})`);
                }

                const data = await response.json();
                const aiReplyText = data.candidates[0].content.parts[0].text;
                
                stopThinkingUI();

                // [수정 포인트 4] API 응답을 정상적으로 받은 후, 안전한 위치에서 턴수 추출
                const turnMatch = aiReplyText.match(/\[턴수\]:\s*(\d+)/);
                const extractedTurn = turnMatch ? parseInt(turnMatch[1]) : 0;

                chatHistory.push({ role: 'ai', content: aiReplyText });
                if (chatHistory.length > 20) {
                    chatHistory.splice(0, 2);
                }
                localStorage.setItem(HISTORY_KEY, JSON.stringify(chatHistory));

                appendAiMessage(aiReplyText);

                if (extractedTurn > 0 && extractedTurn % 10 === 0 && !isSummarizing) {
                    summarizeAndSaveMemoryBook(chatHistory, memoryBookVal, extractedTurn);
                }

            } catch (error) {
                stopThinkingUI();
                console.error("AI 응답 에러:", error);

                // 🛠️ [수정 포인트 2] API 호출 실패 시 에러 롤백 처리 (연속 user 전송 방지)
                if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].role === 'user') {
                    chatHistory.pop(); // 실패한 사용자의 마지막 메시지를 배열에서 제거
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(chatHistory));
                    console.log("통신 실패 방어: 오염된 사용자 메시지 롤백 완료");
                }

                appendAiMessage("⚠️ AI와 연결하는 도중 오류가 발생했습니다. 잠시 후 다시 메시지를 전송해 주세요.");
            }
        }

        async function summarizeAndSaveMemoryBook(history, currentMemoryBook, currentTurn) {
            isSummarizing = true;
            
            // 매개변수로 넘겨받은 AI의 턴수를 기준으로 계산합니다.
            // 인자를 받지 못했을 경우를 대비해 로컬스토리지를 안전장치로 둡니다.
            const turn = currentTurn || parseInt(localStorage.getItem(TURN_KEY)) || 10;
            const startTurn = turn - 9;
            const endTurn = turn;

            const summaryBox = document.createElement('div');
            summaryBox.id = 'summaryBox';
            summaryBox.className = 'sys-msg';
            summaryBox.innerHTML = `📝 ${endTurn}턴 도달: 최근 10턴의 대화 내용을 요약하여 메모리북에 누적 기록 중...`;
            chatContent.appendChild(summaryBox);
            chatContent.scrollTo({ top: chatContent.scrollHeight, behavior: 'smooth' });

            const historyText = history.map(msg => `${msg.role === 'user' ? 'User' : 'AI'}: ${msg.content}`).join('\n');

            const summarizePrompt = `
            다음은 사용자와 AI가 나눈 최근 10턴의 대화 내용입니다. 
            이 대화의 흐름, 사건의 진행 상황, 캐릭터들의 관계 변화를 핵심 위주로 아주 간결하게(2~3줄 내외) 한글로 요약해 주세요.
            이전에 작성되어 있던 요약 내용은 수정 및 삭제를 하지 않습니다, 해당 부분 밑에 이어서 작성하세요.

            [대화 내용]
            ${historyText}
            `.trim();

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: summarizePrompt }] }]
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    const summaryResult = data.candidates[0].content.parts[0].text.trim();

                    // currentMemoryBook이 없을 때 무조건 1~10으로 고정되던 하드코딩 수정
                    const updatedMemoryBook = currentMemoryBook 
                        ? `${currentMemoryBook}\n\n[Turn ${startTurn}~${endTurn} 줄거리 요약]:\n${summaryResult}`
                        : `[Turn ${startTurn}~${endTurn} 줄거리 요약]:\n${summaryResult}`;

                    localStorage.setItem(MEMORY_KEY, updatedMemoryBook);
                    console.log("메모리북 요약 누적 성공:", updatedMemoryBook);

                    summaryBox.remove();

                    const successBanner = document.createElement('div');
                    successBanner.className = 'sys-msg sys-success';
                    successBanner.innerHTML = `✅ ${startTurn}~${endTurn}턴 간의 줄거리가 메모리북에 안전하게 보존되었습니다!`;
                    chatContent.appendChild(successBanner);
                    chatContent.scrollTo({ top: chatContent.scrollHeight, behavior: 'smooth' });
                    setTimeout(() => successBanner.remove(), 3500);
                } else {
                    throw new Error("요약 생성 요청 실패");
                }
            } catch (error) {
                console.error("자동 요약 누적 저장 실패:", error);
                summaryBox.remove();
            } finally {
                isSummarizing = false;
            }
        }

        function appendAiMessage(rawText) {
            const aiMsgBlock = document.createElement('div');
            aiMsgBlock.className = 'msg-block ai';
            
            aiMsgBlock.dataset.raw = rawText;
            
            const parsedText = parseMarkdown(rawText);

            aiMsgBlock.innerHTML = `
                <div class="msg-box">${parsedText}</div>
                <div class="action-btns">
                    <button class="action-btn edit-trigger"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button class="action-btn trash-trigger"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `;
            chatContent.appendChild(aiMsgBlock);
            chatContent.scrollTo({ top: chatContent.scrollHeight, behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCharacterHeaderAndFirstMessage();
            
            // [중요] 변동된 키셋 기준으로 기존 대화 기록 리렌더링
            if (chatHistory && chatHistory.length > 0) {
                Array.from(chatContent.children).forEach(child => {
                    if (child !== firstAiMsgBox && !child.contains(firstAiMsgBox) && !child.classList.contains('floating-sidebar')) {
                        child.remove();
                    }
                });
                
                chatHistory.forEach(msg => {
                    const msgBlock = document.createElement('div');
                    msgBlock.className = msg.role === 'user' ? 'msg-block user' : 'msg-block ai';
                    msgBlock.setAttribute('data-raw', msg.content);
                    msgBlock.innerHTML = `
                        <div class="msg-box">${parseMarkdown(msg.content)}</div>
                        <div class="action-btns">
                            <button class="action-btn edit-trigger"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button class="action-btn trash-trigger"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    `;
                    chatContent.appendChild(msgBlock);
                });
                chatContent.scrollTop = chatContent.scrollHeight;
            }
        });
    </script>
</body>
